name: label-readability
x-python: &python
  build: ./backend
  image: label-readability-local:gb-5203
  environment:
    DATABASE_URL: postgresql://proof:${POSTGRES_PASSWORD:-proof-dev-db-5203}@db:5432/proof
    REDIS_URL: redis://redis:6379/0
    JWT_SECRET: ${JWT_SECRET:-gb-5203-local-demo-jwt-replace-before-deployment}
    SEED_DEMO: ${SEED_DEMO:-true}
  volumes:
    - artifacts:/artifacts
services:
  frontend:
    build: ./frontend
    container_name: ${COMPOSE_PROJECT_NAME:-label-readability}-frontend
    ports: ['127.0.0.1:${FRONTEND_PORT:-18272}:80']
    depends_on:
      backend: {condition: service_healthy}
    healthcheck:
      test: [CMD-SHELL, 'wget -q -O /dev/null http://127.0.0.1/api/health && wget -q -O /dev/null http://127.0.0.1/']
      interval: 3s
      timeout: 4s
      retries: 15
  backend:
    <<: *python
    container_name: ${COMPOSE_PROJECT_NAME:-label-readability}-backend
    ports: ['127.0.0.1:${BACKEND_PORT:-19272}:8000']
    depends_on: &dependencies
      db: {condition: service_healthy}
      redis: {condition: service_healthy}
    healthcheck:
      test: [CMD, python, -c, 'import urllib.request; urllib.request.urlopen("http://127.0.0.1:8000/health", timeout=3)']
      interval: 3s
      timeout: 4s
      retries: 20
  worker:
    <<: *python
    container_name: ${COMPOSE_PROJECT_NAME:-label-readability}-worker
    command: [python, -m, src.worker]
    depends_on:
      <<: *dependencies
      backend: {condition: service_healthy}
    healthcheck:
      test: [CMD, python, -c, 'from src.models.database import cache; from src.config.settings import HEARTBEAT; assert cache.exists(HEARTBEAT)']
      interval: 3s
      timeout: 4s
      retries: 15
  db:
    image: postgres:16-alpine
    container_name: ${COMPOSE_PROJECT_NAME:-label-readability}-db
    environment:
      POSTGRES_USER: proof
      POSTGRES_DB: proof
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-proof-dev-db-5203}
    ports: ['127.0.0.1:${DB_PORT:-17772}:5432']
    volumes: ['db_data:/var/lib/postgresql/data']
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U proof -d proof']
      interval: 3s
      timeout: 4s
      retries: 20
  redis:
    image: redis:7-alpine
    container_name: ${COMPOSE_PROJECT_NAME:-label-readability}-redis
    volumes: ['redis_data:/data']
    healthcheck:
      test: [CMD, redis-cli, ping]
      interval: 3s
      timeout: 4s
      retries: 15
volumes:
  db_data:
  redis_data:
  artifacts:
networks:
  default:
    ipam:
      config:
        - subnet: ${NETWORK_SUBNET:-10.221.203.0/24}
